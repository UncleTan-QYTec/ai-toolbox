<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连接测试 - AI PPT 生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #fff;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 30px;
            text-align: center;
        }
        .test-card {
            background: #1a1a2e;
            border: 1px solid #2d2d44;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .test-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #2d2d44;
        }
        .test-item:last-child {
            border-bottom: none;
        }
        .test-label {
            font-size: 16px;
            color: #a0a0b0;
        }
        .test-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .status-ok {
            color: #10b981;
        }
        .status-error {
            color: #ef4444;
        }
        .status-loading {
            color: #f59e0b;
        }
        .icon {
            font-size: 20px;
        }
        button {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .log {
            background: #0a0a1a;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-line {
            margin-bottom: 5px;
        }
        .log-success { color: #10b981; }
        .log-error { color: #ef4444; }
        .log-info { color: #60a5fa; }
        .result {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 连接测试</h1>

        <div class="test-card">
            <h2 style="margin-bottom: 15px;">后端服务检查</h2>
            <div class="test-item">
                <span class="test-label">后端地址</span>
                <span class="test-status">
                    <span id="apiUrl">http://localhost:3000</span>
                </span>
            </div>
            <div class="test-item">
                <span class="test-label">服务状态</span>
                <span class="test-status" id="serviceStatus">
                    <span class="status-loading">⏳ 检查中...</span>
                </span>
            </div>
            <div class="test-item">
                <span class="test-label">响应时间</span>
                <span class="test-status" id="responseTime">
                    <span class="status-loading">-</span>
                </span>
            </div>
        </div>

        <div class="test-card">
            <h2 style="margin-bottom: 15px;">API 端点检查</h2>
            <div class="test-item">
                <span class="test-label">GET /api/health</span>
                <span class="test-status" id="healthCheck">
                    <span class="status-loading">⏳ 等待检查...</span>
                </span>
            </div>
            <div class="test-item">
                <span class="test-label">POST /api/ppt/generate</span>
                <span class="test-status" id="generateCheck">
                    <span class="status-loading">⏳ 等待检查...</span>
                </span>
            </div>
        </div>

        <button onclick="runAllTests()" id="testButton">
            🚀 运行完整测试
        </button>

        <div class="log" id="logContainer" style="display: none;">
            <h3 style="margin-bottom: 10px;">📋 测试日志</h3>
            <div id="logContent"></div>
        </div>

        <div class="result" id="resultBox" style="display: none;">
            <h3>✅ 测试结果</h3>
            <p id="resultText" style="margin-top: 10px;"></p>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';

        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const logContent = document.getElementById('logContent');
            logContainer.style.display = 'block';

            const line = document.createElement('div');
            line.className = `log-line log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            line.textContent = `[${timestamp}] ${message}`;
            logContent.appendChild(line);
            logContent.scrollTop = logContent.scrollHeight;
        }

        async function checkHealth() {
            const startTime = Date.now();
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                const endTime = Date.now();
                const duration = endTime - startTime;

                document.getElementById('serviceStatus').innerHTML = '<span class="status-ok">✅ 正常运行</span>';
                document.getElementById('responseTime').innerHTML = `<span class="status-ok">${duration}ms</span>`;
                document.getElementById('healthCheck').innerHTML = '<span class="status-ok">✅ 可访问</span>';

                log(`健康检查成功 - ${duration}ms`, 'success');
                log(`服务信息：${JSON.stringify(data)}`, 'info');

                return true;
            } catch (error) {
                document.getElementById('serviceStatus').innerHTML = '<span class="status-error">❌ 无法连接</span>';
                document.getElementById('responseTime').innerHTML = '<span class="status-error">-</span>';
                document.getElementById('healthCheck').innerHTML = '<span class="status-error">❌ 失败</span>';

                log(`健康检查失败：${error.message}`, 'error');
                return false;
            }
        }

        async function testGenerate() {
            try {
                log('测试创建 PPT 任务...', 'info');

                const response = await fetch(`${API_BASE}/ppt/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        topic: '测试连接',
                        slideCount: 3,
                        style: 'business',
                        language: 'zh'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('generateCheck').innerHTML = '<span class="status-ok">✅ 可创建任务</span>';
                    log(`任务创建成功 - ID: ${data.taskId}`, 'success');
                    log(`预计时间：${data.estimatedTime || '未知'}`, 'info');
                    return { success: true, taskId: data.taskId };
                } else {
                    throw new Error(data.error || '创建失败');
                }
            } catch (error) {
                document.getElementById('generateCheck').innerHTML = '<span class="status-error">❌ 创建失败</span>';
                log(`任务创建失败：${error.message}`, 'error');
                return { success: false, error: error.message };
            }
        }

        async function runAllTests() {
            const button = document.getElementById('testButton');
            button.disabled = true;
            button.textContent = '⏳ 测试进行中...';

            document.getElementById('logContainer').style.display = 'block';
            document.getElementById('logContent').innerHTML = '';
            document.getElementById('resultBox').style.display = 'none';

            log('=== 开始连接测试 ===', 'info');
            log(`后端地址：${API_BASE}`, 'info');

            // 检查健康状态
            const healthOk = await checkHealth();

            if (!healthOk) {
                log('❌ 后端服务未运行，请先启动 server.js', 'error');
                showResult(false, '后端服务未运行。请运行：node server.js');
                button.disabled = false;
                button.textContent = '🔄 重新测试';
                return;
            }

            // 测试生成 API
            const generateResult = await testGenerate();

            if (generateResult.success) {
                log('=== 所有测试通过 ===', 'success');
                showResult(true, '前后端连接正常！可以开始使用 PPT 生成功能。');
            } else {
                log('⚠️  部分测试失败', 'error');
                showResult(false, `生成 API 测试失败：${generateResult.error}`);
            }

            button.disabled = false;
            button.textContent = '🔄 重新测试';
        }

        function showResult(success, message) {
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            resultBox.style.display = 'block';
            resultBox.style.background = success ? 'rgba(16, 185, 129, 0.1)' : 'rgba(239, 68, 68, 0.1)';
            resultBox.style.borderColor = success ? '#10b981' : '#ef4444';

            resultText.innerHTML = `
                <strong style="font-size: 18px;">${success ? '✅ 测试通过' : '❌ 测试失败'}</strong><br>
                ${message}
            `;
        }

        // 页面加载时自动检查
        window.addEventListener('DOMContentLoaded', () => {
            log('页面已加载，点击按钮开始测试', 'info');
        });
    </script>
</body>
</html>
